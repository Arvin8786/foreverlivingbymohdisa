<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forever Living by Muhd Isa | Premium Wellness</title>
    <meta name="description" content="Shop Forever Living products, explore the collection, track your orders and manage your rewards with Forever Living by Muhd Isa.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Forever Living by Muhd Isa | Premium Wellness">
    <meta property="og:description" content="Explore the collection, shop your favourites and manage your orders.">
    <meta property="og:image" content="assets/social.jpg">
    <meta property="og:url" content="./">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="./">
    <link rel="icon" type="image/webp" href="assets/logo.webp">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css?v=8">
</head>
<body class="shop">






<div id="maintenance-overlay">
    <img src="assets/logo.webp" alt="Logo" style="width: 120px; height: 120px; margin-bottom: 30px; border-radius: 50%; border: 4px solid var(--gold-accent);">
    <h1>Currently Upgrading</h1>
    <p id="maintenance-message" style="font-size: 1.2rem; max-width: 500px; font-weight: 300; opacity: 0.8;"></p>
</div>

<div id="store-wrapper">
  <header>
    <div class="container">
      <div class="header-content">
        <img src="assets/logo.webp" alt="Business Logo" class="header-logo" onerror="this.style.display='none'">
        <div style="text-align: left;">
            <h1 id="company-name-header">Forever Living by Muhd Isa<span class="by-line">Muhd Arvind Isa</span><span class="slogan">Premium Wellness & Beauty</span></h1>
        </div>
      </div>
    </div>
  </header>
  
  <div id="promo-running-banner"><div class="marquee-content" id="promo-banner-text"></div></div>
  
  <nav>
    <div class="container">
      <ul id="main-nav">
        <li><a onclick="showTab('homepage')">Home</a></li>
        <li><a onclick="showTab('products')">Collections</a></li>
        <li><a onclick="showTab('about')">Our Story</a></li>
        <li><a onclick="showTab('jobs')">Careers</a></li>
        <li><a onclick="showTab('enquiries')">Contact Us</a></li>
        <li><a onclick="showTab('rewards')">Rewards</a></li>
        <li id="nav-login-item"><a id="nav-login-btn" class="nav-login-btn" href="customer.html?login=1">Login</a></li>
        <li id="nav-profile-item" hidden><a class="nav-login-btn" href="customer.html#profile">My profile</a></li>
        <li id="nav-logout-item" hidden><button id="nav-logout-btn" class="nav-account-action" type="button">Logout</button></li>
      </ul>
    </div>
  </nav>
  <p id="shop-account-notice" class="account-notice container" role="status"></p>

  <noscript><p class="container">Please enable JavaScript to browse the live collection, use your cart and access your account.</p></noscript>
  <main id="main-content" class="container"></main>

  <footer class="footer">
      <div class="container">
        <p id="footer-text"></p>
        <div class="timestamp">System Updated: <span id="update-timestamp"></span></div>
      </div>
  </footer>
</div>

<div id="cart-modal" class="modal"></div>
<div id="job-application-modal" class="modal"></div>
<div class="fab-container" id="fab-container"></div>
<div id="eshop-chat-widget"></div>
<div id="popup-modal" class="modal"></div>

<script src="config.js?v=1"></script>
<script src="customer-auth.js?v=1"></script>
<script src="store-core.js?v=2"></script>
<script src="image-map.js?v=1"></script>
<script src="store-ui.js?v=1"></script>
<script src="festival.js?v=1"></script>
<script src="assistant-knowledge.js?v=3"></script>
<script src="assistant-help.js?v=shared-3"></script>
<script src="script.js?v=shared-customer-6"></script>
<script src="store-features.js?v=1"></script>
<script src="shop-account.js?v=1"></script>

</body>
</html>
